; Desktop Companion firmware - ESP32-2432S028R ("Cheap Yellow Display")
;
; TFT_eSPI is configured entirely from build_flags (USER_SETUP_LOADED), so the
; library's own User_Setup.h is never edited. Display pin notes: docs/hardware.md

[platformio]
default_envs = cyd
; secrets.ini is gitignored (copy secrets.example.ini). Holds the OTA password.
extra_configs = secrets.ini

[env]
platform = espressif32@6.9.0          ; Arduino-ESP32 core 2.0.17 (TFT_eSPI-compatible)
board = esp32dev
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
upload_speed = 460800                 ; conservative for the CH340 bridge
monitor_filters = esp32_exception_decoder, time
extra_scripts =
    pre:scripts/build_info.py         ; stamps the build time into version.cpp
    post:scripts/upload_wait.py       ; USB upload waits for BOOT to be held (see docs/hardware.md)
; 2 x 1.9 MB app slots (OTA-capable). NVS stays at 0x9000, so stored settings
; and touch calibration survive the switch from the default table.
board_build.partitions = min_spiffs.csv
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    ; registry copy is an old snapshot without begin(SPIClass&) - pin the v1.4 tag
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    tzapu/WiFiManager@2.0.17          ; phone-based WiFi + location setup portal
    bblanchon/ArduinoJson@7.2.1       ; Open-Meteo JSON parsing
    ; QR codes use ESP-IDF's built-in esp_qrcode (no extra library)

build_flags =
    -DCORE_DEBUG_LEVEL=1
    '-DOTA_PASSWORD="${secrets.ota_password}"'
    ; ---------- TFT_eSPI configuration (display on HSPI) ----------
    -DUSER_SETUP_LOADED=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1  ; silences "TOUCH_CS not defined" (touch uses XPT2046 lib)
    -DUSE_HSPI_PORT=1                 ; keep VSPI free for XPT2046 touch / SD card
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1                      ; panel reset is tied to the ESP32 EN line
    ; TFT_BL intentionally NOT defined: firmware owns the backlight (GPIO21)
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; Original single-USB CYD (micro-USB only): ILI9341
[env:cyd]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1

; Two-USB CYD variant (micro-USB + USB-C): ST7789 panel, inverted colours.
; Use this env if the diagnostic shows inverted colours (black looks white).
[env:cyd2usb]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DTFT_INVERSION_ON=1
    -DTFT_RGB_ORDER=TFT_BGR

; Wireless update over the home network (no BOOT button, COM3 stays with the tray app).
;   pio run -e cyd_ota -t upload
; The PC must accept one incoming connection from the device on host_port: allow
; Python on *private* networks when Windows Firewall asks.
[env:cyd_ota]
extends = env:cyd
upload_protocol = espota
upload_port = desk-companion.local
upload_flags =
    --auth=${secrets.ota_password}
    --host_port=46820
